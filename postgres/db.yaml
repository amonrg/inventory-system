services:
  postgres:
    image: postgres
    container_name: postgres
    restart: always    
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - default
      - monitoring
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:

networks:
  monitoring:
    external: true
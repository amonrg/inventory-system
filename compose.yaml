include:
  - path: ./postgres/db.yaml
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
  
  proxy:
    build: nginx
    restart: always
    ports:
      - 80:80
    depends_on:
      - app
    networks:
      - default
      - monitoring

networks:
  monitoring:
    external: true
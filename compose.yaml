include:
  - path: ./postgres/db.yaml
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
    networks:
      - default
  
  proxy:
    build: nginx
    restart: always
    ports:
      - 80:80
    depends_on:
      - app
    networks:
      - default
      - monitoring

networks:
  monitoring:
    external: true